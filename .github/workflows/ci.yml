# This is a GitHub Actions workflow for Project EA Bot CI/CD
# WARNING: Several steps below will NOT work without the Node.js binary installed in the CI environment.
#           The current development environment lacks 'node' (only npm is available).
#           Ensure Node.js is available in the runner before enabling these steps.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ==========================================
  # CODE QUALITY & LINTING
  # ==========================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # ⚠ WARNING: This step requires Node.js binary.
      #   The current dev environment is MISSING 'node' (only npm is present).
      #   Without Node.js installed in the runner, this step will fail.
      #   Fix: ensure NODE_VERSION is available or use setup-node action.
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/python/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/python/requirements.txt

      # ---------------------------------------------------------
      # ⚠ WARNING: Requires Node.js binary to run lint scripts.
      #   If 'node' is unavailable, frontend lint will fail.
      # ---------------------------------------------------------
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend lint
        run: npm run lint --workspace=project-ea-bot-web

      - name: Run backend lint
        run: |
          python -m pip install flake8
          python -m flake8 services/python/ --max-line-length=100 --extend-ignore=E203,W503

  # ==========================================
  # TYPE CHECKING
  # ==========================================
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/python/requirements.txt

      # ---------------------------------------------------------
      # ⚠ WARNING: Jika backend menggunakan mypy/tipe checking,
      #   pastikan sudah di-setup di requirements.txt
      # ---------------------------------------------------------
      - name: Run type checking
        run: |
          # Ganti dengan perintah type checking yang sesuai
          # python -m mypy services/python/
          echo "Type checking not yet configured"

  # ==========================================
  # TESTS
  # ==========================================
  test:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL service container
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ea_bot_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ea_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service container
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/python/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/python/requirements.txt
          pip install pytest pytest-cov

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://ea_bot_user:test_password@localhost:5432/ea_bot_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd services/python
          python -m pytest tests/ -v

      - name: Run Node API tests
        run: npm test --workspace=project-ea-bot-api

      - name: Lint frontend
        run: |
          cd apps/web
          npm run lint

      - name: Type-check frontend
        run: |
          cd apps/web
          npx tsc --noEmit

  # ==========================================
  # BUILD
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # ⚠ WARNING: Build step requires Node.js binary.
      #   Frontend build (Webpack/Vite/etc.) executes via Node.js.
      #   Without 'node', this entire job fails.
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/python/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: |
          cd apps/web
          npm run build

      - name: Collect backend static files
        run: |
          # Untuk Django: python manage.py collectstatic --noinput
          # Untuk FastAPI: disesuaikan
          echo "Backend static collection not yet configured"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web/.next/
            services/python/static/
          retention-days: 7

  # ==========================================
  # SECURITY SCAN (Dependency audit)
  # ==========================================
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/python/requirements.txt

      - name: Run Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r services/python/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend dependency audit
        run: npm audit --audit-level=high

  # ==========================================
  # DEPLOY (opt-in — aktif HANYA bila target + secrets dikonfigurasi)
  # ==========================================
  # Deploy nyata butuh target yang diputuskan operator. Gate di bawah membuat
  # job ini SKIP (bukan gagal) sampai VPS_HOST + VPS_SSH_KEY diisi sebagai
  # repository secrets; setelah itu deploy berjalan otomatis.
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment target configured
        id: gate
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy dilewati: set VPS_HOST / VPS_USER / VPS_SSH_KEY / DEPLOY_PATH sebagai repository secrets."
          fi

      # Deploy ke VPS via SSH — pull terbaru + rebuild stack Docker.
      - name: Deploy to VPS
        if: steps.gate.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '/var/www/project-ea-bot' }}"
            git pull origin main
            docker compose -f infrastructure/docker/docker-compose.yml up -d --build
            docker compose -f infrastructure/docker/docker-compose.yml ps

      - name: Deploy skipped (target not configured)
        if: steps.gate.outputs.configured != 'true'
        run: echo "No deployment target configured — CI remains green."

  # ==========================================
  # NOTIFICATION (Opsional)
  # ==========================================
  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()

    steps:
      - name: Notify build result
        run: |
          # Ganti dengan notifikasi yang sesuai:
          # - Slack webhook
          # - Discord webhook
          # - Email
          # - Teams webhook
          echo "CI pipeline finished. Result: ${{ needs.test.result }}"
