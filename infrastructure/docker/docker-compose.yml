api:
  image: node:22-alpine
  working_dir: /app
  volumes:
    - ../../apps/api:/app
  command: sh -c "npm install && npm run dev"
  ports:
    - "3789:3789"
  environment:
    - NODE_ENV=development
    - PORT=3789
    - HOST=0.0.0.0
  depends_on:
    - db

web:
  image: node:22-alpine
  working_dir: /app
  volumes:
    - ../../apps/web:/app
  command: sh -c "npm install && npm run dev"
  ports:
    - "4321:4321"
  environment:
    - NODE_ENV=development
    - PORT=4321
    - NEXT_PUBLIC_API_URL=http://localhost:3789
  depends_on:
    - api

python:
  image: python:3.11-slim
  working_dir: /app
  volumes:
    - ../../services/python:/app
  command: sh -c "pip install -r requirements.txt && uvicorn src.main:app --reload --host 0.0.0.0 --port 8787"
  ports:
    - "8787:8787"
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app:/app/src

db:
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: eabot
    POSTGRES_PASSWORD: eabot_password
    POSTGRES_DB: eabot
  ports:
    - "5432:5432"
  volumes:
    - postgres_data:/var/lib/postgresql/data

redis:
  image: redis:7-alpine
  ports:
    - "6379:6379"
  volumes:
    - redis_data:/data

volumes:
  postgres_data:
  redis_data:
